# Test compose — 2 tunnels. Copy .env.example to .env and fill credentials.
# Drop your own .ovpn profiles next to this file as oxitun-1.ovpn / oxitun-2.ovpn.
name: oxitun

x-oxitun: &oxitun
  image: ghcr.io/oxitun/oxitun:latest
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  env_file:
    - .env
  mem_limit: 32m
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  vpn-1:
    <<: *oxitun
    container_name: oxitun-1
    environment:
      VPN_PROFILE: /etc/openvpn/client.ovpn
      UDP_ADVERTISE_PORT: "18011"
    volumes:
      - ./oxitun-1.ovpn:/etc/openvpn/client.ovpn:ro
    ports:
      - "127.0.0.1:18011:8888"
      - "127.0.0.1:18011:8888/udp"

  vpn-2:
    <<: *oxitun
    container_name: oxitun-2
    environment:
      VPN_PROFILE: /etc/openvpn/client.ovpn
      UDP_ADVERTISE_PORT: "18012"
    volumes:
      - ./oxitun-2.ovpn:/etc/openvpn/client.ovpn:ro
    ports:
      - "127.0.0.1:18012:8888"
      - "127.0.0.1:18012:8888/udp"
